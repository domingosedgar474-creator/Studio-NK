<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Studio Universal</title><style>body{background:#000;color:#fff;font-family:sans-serif;padding:10px}h1{color:#E10600;text-align:center}input{width:100%;padding:15px;border-radius:25px;border:none;background:#222;color:#fff;margin-top:20px}button{width:100%;padding:15px;background:#E10600;color:#fff;border:none;border-radius:25px;margin-top:10px;font-weight:700}.box{background:#111;padding:12px;border-radius:12px;margin-top:12px;border-left:3px solid #E10600}img{width:100%;border-radius:10px;margin-top:8px}</style></head><body><h1>Studio APK UNIVERSAL</h1><p style="text-align:center">Faz App, Jogo, Musica, Video</p><div id="chat"><div class="box">IA pronta. Ex: Faz app moto-taxi vermelho<br>Faz musica kuduro<br>Cria jogo avião</div></div><input id="q" placeholder="Escreve aqui..."><button onclick="go()">GERAR</button><script>function go(){let p=document.getElementById('q').value;if(!p)return;let t=p.toLowerCase().includes('jogo')?'JOGO':p.toLowerCase().includes('musica')||p.toLowerCase().includes('kuduro')?'MUSICA':'APP';let img='https://image.pollinations.ai/prompt/'+encodeURIComponent(p)+'?width=512&height=512&nologo=1&seed='+Math.random();let h=`<div class=box><b>${t}: ${p}</b><br><br>Arquitetura completa gerada com cor #E10600<br>Backend Firebase grátis<br><img src=${img}><br><button style="background:#fff;color:#000">📌 GUARDAR</button></div>`;document.getElementById('chat').innerHTML+=h;document.getElementById('q').value=''} </script></body></html>
